<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yami</title>

<link rel="apple-touch-icon" href="app.png">
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:0;background:#fff;color:#222}
*{box-sizing:border-box}
.ac{text-align:center}
.ar{text-align:right}
.fl{float:left}
.fr{float:right}
.b{font-weight:bold}
.small{font-size:0.8em}
.hand{cursor:pointer}
.red{color:#e55}
.green{color:#5c5}
.blue{color:#55e}
.grey{color:#999}
.bg-grey{background:#f0f0f0}
.bg-green{background:#5c5;color:#fff}
.bg-gold{background:#fc6}
.bg-blue{background:#55e;color:#fff}
.bg-red{background:#e55;color:#fff}
.line{border-bottom:1px solid #ddd;padding:6px 0}
.line-s{padding:4px 0}
.box{border:1px solid #ddd;padding:8px;margin-bottom:8px;border-radius:4px}
.cell-1,.cell-2,.cell-4,.cell-7,.cell-8,.cell-12{display:inline-block;vertical-align:middle}
.cell-1{width:calc(25%/3)}
.cell-2{width:calc(50%/3)}
.cell-4{width:calc(100%/3)}
.cell-7{width:calc(175%/3)}
.cell-8{width:calc(200%/3)}
.cell-12{width:100%}
.my-3{margin:12px 0}
.py-2{padding:8px 0}
.px-1{padding:0 4px}
.rc{border-radius:50%;padding:2px 6px}
.hide{display:none}
input[type="number"],input[type="text"],textarea{padding:4px;border:1px solid #ccc;border-radius:3px;font-size:14px}
input[type="submit"],button{border:none;padding:6px 12px;border-radius:3px;cursor:pointer;font-weight:bold;font-size:14px}
.cal{display:flex;flex-wrap:wrap}
.cal>div{width:calc(100%/7 - 2.005px);background:#eee;margin:1px;padding:0 1px;text-align:center;min-height:60px;font-size:15px}
.cal>div.other-month{background:#eed}
.cal>div>a{text-decoration:none;color:#333;display:block;padding:2px}
.cal .on{background:#fec}
.cal a{color:#888}
.one,.half{display:inline-block;width:12px;height:12px;border-radius:12px;background:#f90;margin:1px}
.half{border-radius:0 12px 12px 0;width:6px}
.not-done{background:#ddd}
.not-done-x{background:#ccc}
.not-done-x2{background:#999}
.not-done-x3{background:#666}
.done-green{background:#5c5}
.done-red{background:#f90}
.done-red2{background:#e55}
.done-red3{background:#a55}
.weekday{font-weight:bold;background:#ddd!important;min-height:auto!important}
#form .line-s b{cursor:pointer;user-select:none}
.toolbar{display:flex;gap:8px;justify-content:center;margin:8px 0}
.toolbar button{background:#eee;font-weight:normal}
.month-nav{display:flex;align-items:center;background:#fc6;border-radius:4px 4px 0 0;padding:6px 8px;font-weight:bold;border:1px solid #e0b84a;border-bottom:none}
.month-nav .side{display:flex;gap:6px}
.month-nav a{color:#333;text-decoration:none;font-weight:bold;padding:8px 20px;border-radius:3px;transition:background 0.15s}
.month-nav a:hover{background:rgba(255,255,255,0.5)}
.month-nav .title{flex:1;text-align:center;font-size:15px}
.month-nav .title a{text-decoration:underline}
</style>
</head>

  // ================= public API =================
  static ymd(input = null) {
    const ts = Lunar._toTs(input);
    const [ymdStr, his] = ts.split(' ');
    const [y, m, d] = ymdStr.split('-').map(Number);
    let csvStr = Lunar._loadCsv(y);
    let dObj   = Lunar._csv2dates(csvStr, y);
    let lunarY = y;
    const ymdhi = ymdStr + ' ' + his.substring(0, 5);
    if (ymdhi < dObj.sun[2]) lunarY--;
    if (ymdStr < dObj.moon[0]) {
      const dNext = dObj;
      csvStr = Lunar._loadCsv(y - 1);
      dObj   = Lunar._csv2dates(csvStr, y - 1);
      dObj.sun[13] = dNext.sun[1];
      dObj.sun[14] = dNext.sun[2];
      dObj.sun[15] = dNext.sun[3];
    } else {
      csvStr = Lunar._loadCsv(y + 1);
      const dNext = Lunar._csv2dates(csvStr, y + 1);
      dObj.sun[13] = dNext.sun[1];
      dObj.sun[14] = dNext.sun[2];
    }
    const d1 = Lunar._julianDay(dObj.moon[0]); // lunar new year
    const d2 = Lunar._julianDay(ymdStr);
    let daysDiff = d2 - d1;
    let lunarM = 1;
    let lunarD = 1;
    let isLeap = 0;

    for (let i = 1; i < 15; i++) {
      const monthLength = dObj.moon[i];
      if (daysDiff < monthLength) { lunarD = daysDiff + 1; break; }
      daysDiff -= monthLength;
      lunarM++;
    }
    if (dObj.moon.leap && lunarM >= dObj.moon.leap + 1) {
      lunarM--;
      if (lunarM === dObj.moon.leap) isLeap = 1;
    }

    let jq = 1;
    for (const k of Object.keys(dObj.sun)) {
      if (ymdhi >= dObj.sun[k]) jq = parseInt(k, 10);
    }

    if (jq > 13) {
      jq -= 12;
      csvStr = Lunar._loadCsv(y);
      const dCur = Lunar._csv2dates(csvStr, y);
      dObj.moon = dCur.moon;
      dObj.sun  = dCur.sun;
      csvStr = Lunar._loadCsv(y + 1);
      const dNext = Lunar._csv2dates(csvStr, y + 1);
      dObj.sun[13] = dNext.sun[1];
      dObj.sun[14] = dNext.sun[2];
    }

    const data = Object.assign(
      { m: lunarM, d: lunarD },
      { isLeap, jq, ts },
      dObj
    );
    return Object.assign(data, Lunar.cn(data));
  }

  static day(input) {
    const y = Lunar.ymd(input);
    const tsDate = y.ts.split(' ')[0];
    const jqDate = y.sun[y.jq].split(' ')[0];
    if (tsDate === jqDate) return y.cjq;
    return y.d === 1 ? y.cm : y.cd;
  }

  static cn(data) {
    const cm  = (data.isLeap ? '閏' : '') + Lunar.MON[data.m] + (data.isLeap ? '' : '月');
    const cd  = Lunar.DAY[data.d];
    const cjq = Lunar.JQ[((data.jq - 1) % 12 + 12) % 12];
    return { cm, cd, cjq };
  }

  // ================= internals =================

  static _pad(x) { return x > 9 ? String(x) : '0' + x; }

  static _base62CharToInt(char) {
    const ord = char.charCodeAt(0);
    if (char >= '0' && char <= '9') return ord - 48;
    if (char >= 'A' && char <= 'Z') return ord - 65 + 10;
    if (char >= 'a' && char <= 'z') return ord - 97 + 36;
    throw new Error(`Invalid base62 character: ${char}`);
  }

  static _csv2dates(str, y) {
    //if (!str) return {};
    if (!str) throw new Error(`Lunar._csv2dates: no CSV for year ${y}`);
    const d = { moon: {}, sun: {} };
    d.moon.leap = Lunar._base62CharToInt(str[0]);
    d.moon[0]   = `${y}-${Lunar._pad(Lunar._base62CharToInt(str[14]))}-${Lunar._pad(Lunar._base62CharToInt(str[15]))}`;
    for (let i = 1; i < 14; i++) {
      d.moon[i] = 29 + Lunar._base62CharToInt(str[i]);
    }
    if (!d.moon.leap) d.moon[13] = 0;
    const jq = str.substring(16).match(/.{1,3}/g) || [];
    for (let i = 1; i < 13; i++) {
      const v = jq[i - 1];
      d.sun[i] = `${y}-${Lunar._pad(i)}-${Lunar._pad(Lunar._base62CharToInt(v[0]))} ${Lunar._pad(Lunar._base62CharToInt(v[1]))}:${Lunar._pad(Lunar._base62CharToInt(v[2]))}`;
    }
    return d;
  }

  static _julianDay(ymd) {
    const arr = String(ymd).split('-');
    let y, m, d;
    if (arr.length === 4) {
      y = 1 - parseInt(arr[1], 10);
      m = parseInt(arr[2], 10);
      d = parseInt(arr[3], 10);
    } else {
      y = parseInt(arr[0], 10);
      m = parseInt(arr[1], 10);
      d = parseInt(arr[2], 10);
    }
    if (m <= 2) { y -= 1; m += 12; }
    const A = Math.trunc(y / 100);
    const B = 2 - A + Math.trunc(A / 4);
    return Math.trunc(365.25 * (y + 4716)) + Math.trunc(30.6001 * (m + 1)) + d + B - 1524;
  }

  static _loadCsv(y) {
    const csv = Lunar.csv;
    const keys = Object.keys(csv).map(Number);
    if (!keys.length) throw new Error('Lunar.csv is empty');
    const min = Math.min(...keys), max = Math.max(...keys);

    if (csv[y] !== undefined) return csv[y];

    // 19-year Metonic fallback
    for (let step = 19; step <= 190; step += 19) {
        if (csv[y - step] !== undefined) return csv[y - step];
        if (csv[y + step] !== undefined) return csv[y + step];
    }
    if (y < min) return csv[min];
    if (y > max) return csv[max];
    throw new Error(`Lunar: no data for year ${y} (have ${min}–${max})`);
  }

  static _formatDateTime(dt) {
    const p = Lunar._pad;
    return `${dt.getFullYear()}-${p(dt.getMonth() + 1)}-${p(dt.getDate())} ` +
      `${p(dt.getHours())}:${p(dt.getMinutes())}:${p(dt.getSeconds())}`;
  }

  static _toTs(input = null) {
    if (input === null || input === undefined) {
      return Lunar._formatDateTime(new Date());
    }
    // Accept "2025-12-23 11:22:33" or "2025-12-23_11.22.33"
    const normalized = decodeURIComponent(String(input))
      .replace(/_/g, ' ')
      .replace(/\./g, ':');
    const parts = normalized.split(' ');
    const [Y, M, D] = parts[0].split('-').map(Number);
    let h = 0, i = 0, s = 0;
    if (parts[1]) {
      const hms = parts[1].split(':').map(Number);
      h = hms[0] || 0; i = hms[1] || 0; s = hms[2] || 0;
    }
    return Lunar._formatDateTime(new Date(Y, M - 1, D, h, i, s));
  }
}
window.Lunar = Lunar;

// ============ CSV UTILITIES ============
const CSV_HEADER = 'ymd,yami,bleed,bruise,veg,finger,inr,done,note';
const STORAGE_KEY = 'YAMI';

// Escape one CSV field (RFC 4180 style)
function csvEscape(v) {
  const s = (v === null || v === undefined) ? '' : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

// Parse a CSV string into rows (array of arrays of strings).
// Handles quoted fields, embedded commas, embedded newlines.
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  let i = 0;
  while (i < text.length) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    } else {
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ',')  { row.push(field); field = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') {
        row.push(field); field = '';
        rows.push(row); row = [];
        i++; continue;
      }
      field += c; i++; continue;
    }
  }
  // last field / row
  if (field.length > 0 || row.length > 0) {
    row.push(field);
    rows.push(row);
  }
  return rows;
}

function dataFromCSV(text) {
  const rows = parseCSV(text);
  const data = {};
  for (let r = 0; r < rows.length; r++) {
    const parts = rows[r];
    if (parts.length < 2) continue;
    if (r === 0 && parts[0] === 'ymd') continue; // skip header
    const [ymd, yami, bleed, bruise, veg, finger, inr, done, ...noteParts] = parts;
    if (!ymd) continue;
    data[ymd] = {
      ymd,
      yami:   parseInt(yami)     || 0,
      bleed:  parseInt(bleed) || 0,
      bruise: parseInt(bruise)   || 0,
      veg:    parseInt(veg)      || 0,
      finger: finger || '',
      inr:    parseInt(inr)      || 0,
      done:   done || '',
      note:   noteParts.join(',') || '' // extra commas inside quoted field already collapsed
    };
  }
  return data;
}

function csvFromData(data) {
  const lines = [CSV_HEADER];
  Object.values(data)
    .sort((a,b) => a.ymd.localeCompare(b.ymd))
    .forEach(d => {
      lines.push([
        csvEscape(d.ymd),
        csvEscape(d.yami),
        csvEscape(d.bleed),
        csvEscape(d.bruise),
        csvEscape(d.veg),
        csvEscape(d.finger),
        csvEscape(d.inr),
        csvEscape(d.done),
        csvEscape(d.note || '')
      ].join(','));
    });
  return lines.join('\n');
}

// ============ DATA LAYER ============
function loadAllData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return {};
  return dataFromCSV(raw);
}

function saveAllData(data) {
  localStorage.setItem(STORAGE_KEY, csvFromData(data));
}

function getDayData(data, ymd) {
  if (!data[ymd]) data[ymd] = { ymd, yami: 0, bleed: 0, bruise: 0, veg: 0, finger: '', inr: 0, done: '', note: '' };
  return data[ymd];
}

// ============ DATE UTILITIES ============
function formatYMD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseYMD(ymd){const [y,m,d]=ymd.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(ymd,n){const d=parseYMD(ymd);d.setDate(d.getDate()+n);return formatYMD(d);}
function addMonths(ymd,n){const d=parseYMD(ymd);d.setMonth(d.getMonth()+n);return formatYMD(d);}
function addYears(ymd,n){const d=parseYMD(ymd);d.setFullYear(d.getFullYear()+n);return formatYMD(d);}
function getMonthDays(ymd){const d=parseYMD(ymd);return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();}
function getDayOfWeek(ymd){return parseYMD(ymd).getDay();}
function getMonday(ymd){const dow=getDayOfWeek(ymd);return addDays(ymd,dow===0?-6:1-dow);}
function getSunday(ymd){const dow=getDayOfWeek(ymd);return addDays(ymd,dow===0?0:7-dow);}

function lunarDay(ymd) { return Lunar.day(ymd + ' 22:59:59'); }

// ============ INR ============
function calInr(data, ymd) {
  const dates = Object.keys(data).filter(d => d <= ymd).sort();

  const tests = [];
  for (let i = dates.length - 1; i >= 0 && tests.length < 2; i--) {
    if (data[dates[i]].inr) tests.push(dates[i]);
  }
  if (tests.length < 2) return { avg: null, predicted: null };

  const [test3, test2] = tests;
  const INR2 = data[test2].inr / 10;
  const INR3 = data[test3].inr / 10;

  const i2 = dates.indexOf(test2);
  const i3 = dates.indexOf(test3);
  const iy = dates.indexOf(ymd);

  const D = i3 - i2;
  let T = 0;
  for (let i = i2; i < i3; i++) T += (data[dates[i]].yami || 0) / 10;

  const avg = (T + INR2 - INR3) / D;

  let predicted = INR3;
  for (let i = i3; i < iy; i++) predicted += (data[dates[i]].yami || 0) / 10 - avg;

  return { avg, predicted };   // full precision
}

// ============ RENDER ============
let currentYmd = '';
let allData = {};

function render() {
  const app = document.getElementById('app');
  let html = renderMonth(currentYmd);
  html += renderForm(currentYmd);
  html += renderMonth(addMonths(currentYmd, 1), true);
  html += '<div class="toolbar">';
  html +=   '<button type="button" onclick="exportCSV()">Export All</button>';
  html +=   '<button type="button" onclick="exportMonthCSV()">Export Month</button>';
  html +=   '<button type="button" onclick="document.getElementById(\'file-input\').click()">Import</button>';
  html +=   '<input id="file-input" type="file" accept=".csv,text/csv" class="hide" onchange="importCSV(event)">';

  html +=   '<button type="button" onclick="copyMonthCSV()">Copy</button>';
  html +=   '<button type="button" onclick="uploadPastedCSV()">Paste</button>';
  html += '</div>';
  html += '<textarea id="csv-paste" rows="8" class="cell-12" placeholder="Paste CSV data here..."></textarea>';
  app.innerHTML = html;
}

function renderForm(ymd) {
  const day = getDayData(allData, ymd);

  let html = `<form id="form" class="my-3" onsubmit="handleFormSubmit(event)">`;
  html += `<div class="box bg-gold line-s" style="margin-bottom:0;border:none">`;
  html += `<b id="f-ymd" class="cell-4">${ymd}</b>`;
  // Use data-cmd so we can read it via e.submitter
  html += `<input type="submit" name="cmd" data-cmd="toggle-done" value="${day.done ? 'Taken @ ' + day.done : 'Take Now'}" class="cell-7 ${day.done ? 'bg-grey' : 'bg-green'}">`;
  html += `<b class="cell-1 ar hand" onclick="document.getElementById('form').classList.add('hide')">×</b>`;
  html += `</div>`;
  html += `<div class="box"><div class="line">`;

  // Yami
  html += `<b class="cell-4">Yami</b><span id="f-yami" class="cell-8 line-s">`;
  html += `<input type="hidden" name="yami" value="${day.yami}">`;
  html += `<b class="cell-2" onclick="toggleYami(this)"><b class="half${day.yami % 10 === 5 ? '' : ' not-done'}"></b></b>`;
  for (let i = 10; i < 60; i += 10) {
    html += `<b class="cell-2" onclick="toggleYami(this)"><b class="one${day.yami >= i ? '' : ' not-done'}"></b></b>`;
  }
  html += `</span>`;

  // Bleed
  html += `<b class="cell-4">Bleed</b><span id="f-bleed" class="cell-8 line-s">`;
  html += `<input type="hidden" name="bleed" value="${day.bleed}">`;
  for (let i = 1; i < 4; i++) html += `<b class="cell-2 ${day.bleed >= i ? 'red' : 'grey'}" onclick="toggleBleed(this, ${i})">&#10082;</b>`;
  html += `</span>`;

  // Bruise
  html += `<b class="cell-4">Bruise</b><span id="f-bruise" class="cell-8 line-s">`;
  html += `<input type="hidden" name="bruise" value="${day.bruise}">`;
  for (let i = 1; i < 4; i++) html += `<b class="cell-2 ${day.bruise >= i ? 'blue' : 'grey'}" onclick="toggleBruise(this, ${i})">&#8853;</b>`;
  html += `</span>`;

  // Veg
  html += `<b class="cell-4">Veg</b><span id="f-veg" class="cell-8 line-s">`;
  html += `<input type="hidden" name="veg" value="${day.veg}">`;
  for (let i = 1; i < 4; i++) html += `<b class="cell-2 ${day.veg >= i ? 'green' : 'grey'}" onclick="toggleVeg(this, ${i})">&#9827;</b>`;
  html += `</span>`;

  // Finger
  html += `<b class="cell-4">Finger</b><span id="f-finger" class="cell-8 line-s">`;
  html += `<input type="hidden" name="finger" value="${day.finger}">`;
  const fingers = ['L2','L3','L4','R2','R3','R4'];
  const arr = day.finger ? day.finger.split(' ') : [];
  for (const f of fingers) html += `<b class="cell-2 ${arr.includes(f) ? 'red' : ''}" onclick="toggleFinger(this, '${f}')">${f}</b>`;
  html += `</span>`;

  // INR
  html += `<b class="cell-4">INR</b><span class="cell-8 line-s">`;
  html += `<input type="number" name="inr" value="${(day.inr / 10).toFixed(1)}" class="cell-4" step=".1"> `;
  html += `<input type="submit" name="cmd" data-cmd="save" class="bg-green cell-4" value="Save">`;
  html += `</span>`;
  html += `<textarea name="note" class="cell-12" style="height:80px">${escapeHtml(day.note)}</textarea>`;
  html += `</div></div></form>`;
  return html;
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMonth(ymd, isNext = false) {
  let html = '';

  // ── Month navigation bar ─────────────────────
  html += `<div class="month-nav">`;
  html +=   `<span class="side">`;
  html +=     `<a href="#" onclick="navigate('${addYears(ymd,-1)}');return false" title="Prev year">&#171;</a>`;
  html +=     `<a href="#" onclick="navigate('${addMonths(ymd,-1)}');return false" title="Prev month">&#8249;</a>`;
  html +=   `</span>`;
  html +=   `<span class="title">`;
  html +=     `<a href="#" onclick="navigate('${formatYMD(new Date())}');return false">${formatMonthYear(ymd)}</a>`;
  html +=   `</span>`;
  html +=   `<span class="side">`;
  html +=     `<a href="#" onclick="navigate('${addMonths(ymd,1)}');return false" title="Next month">&#8250;</a>`;
  html +=     `<a href="#" onclick="navigate('${addYears(ymd,1)}');return false" title="Next year">&#187;</a>`;
  html +=   `</span>`;
  html += `</div>`;

  // ── Calendar grid ────────────────────────────
  html += `<div class="cal hand">`;
  for (const d of ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']) {
    html += `<div class="weekday b">${d}</div>`;
  }

  const today = formatYMD(new Date());
  const monthStart = ymd.substring(0,7) + '-01';
  const monthEnd   = ymd.substring(0,7) + '-' + String(getMonthDays(ymd)).padStart(2,'0');
  let current = getMonday(monthStart);
  const last  = getSunday(monthEnd);

  while (current <= last) {
    const isCurrentMonth = current.substring(0,7) === ymd.substring(0,7);
    const isToday        = current === today;
    const isSelected     = current === ymd && !isNext;

    html += `<div class="day${isToday ? ' on' : ''}${!isCurrentMonth ? ' grey other-month' : ''}" onclick="navigate('${current}')">`;
    html +=  `<span${isSelected ? ' class="red"' : ''}>${current.substring(8)}</span>`;
    html +=  `<br><span class="small grey">${lunarDay(current)}</span>`;
    html += renderYamiMarkers(current);
    html += `</div>`;

    current = addDays(current, 1);
  }

  html += `</div>`;
  return html;
}

function formatMonthYear(ymd) {
  const d = parseYMD(ymd);
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getFullYear();
}

function renderYamiMarkers(ymd) {
  if (!allData[ymd]) return '';
  const data = allData[ymd];
  let html = '<br>';

  const isDone = data.done;
  let statusClass;
  if (isDone) {
    statusClass = data.yami > 25 ? ' done-red3' :
      data.yami === 25 ? ' done-red2' :
      data.yami === 20 ? ' done-red' : ' done-green';
  } else {
    statusClass = data.yami > 25 ? ' not-done-x3' :
      data.yami === 25 ? ' not-done-x2' :
      data.yami === 20 ? ' not-done-x' : ' not-done';
  }

  for (let i = 10; i <= data.yami; i += 10) html += `<b class="one${statusClass}"></b> `;
  if (data.yami % 10 === 5) html += `<b class="half${statusClass}"></b>`;

  const inrResult = calInr(allData, ymd);
  if (data.finger) {
    html += `<br>${data.finger} `;
    const inr = data.inr / 10;
    if (inr < 2.5) html += `<i class="green">${inr}</i>`;
    else if (inr > 3.5) html += `<i class="red">${inr}</i>`;
    else html += inr;
    html += `<br><i class="grey small">~<i style="background-color:#998;border-radius:30%;padding:0 5px;color:#eee">${inrResult.avg ? inrResult.avg.toFixed(3) : 0}</i></i>`;
  } else if (inrResult.predicted !== null) {
    html += `<br><i class="grey small">${inrResult.predicted.toFixed(2)}</i>`;
  }
  html += '<br>';
  for (let i = 0; i < data.bleed; i++) html += '<b class="red">&#10082;</b> ';
  for (let i = 0; i < data.bruise; i++) html += '<b>&#8853;</b> ';
  for (let i = 0; i < data.veg; i++) html += '<b class="green">&#9827;</b> ';

  if (data.note) {
    const shortNote = data.note.replace(/\n/g, ' ').substring(0,15);
    html += `<br><i class="small">${escapeHtml(shortNote)}</i>`;
  }
  return html;
}

// ============ EVENTS ============
function navigate(ymd) { currentYmd = ymd || formatYMD(new Date()); render(); }

function toggleYami(el) {
  const input = el.parentElement.querySelector('input[name="yami"]');
  const innerB = el.querySelector('b');
  let val = parseInt(input.value) || 0;

  if (innerB.classList.contains('half')) {
    if (val % 10 === 5) input.value = val - 5;
    else input.value = val + 5;
  } else {
    const cells = Array.from(el.parentElement.querySelectorAll(':scope > .cell-2'));
    const idx = cells.indexOf(el);          // 0=half, 1=10, 2=20...
    const circleVal = idx * 10;
    if (val >= circleVal) {
      input.value = circleVal - 10;
      if (val % 10 === 5) input.value = circleVal - 5;
    } else input.value = circleVal;
  }
  updateYamiDisplay(el.parentElement);
}

function updateYamiDisplay(container) {
  const val = parseInt(container.querySelector('input[name="yami"]').value) || 0;
  const cells = Array.from(container.querySelectorAll(':scope > .cell-2'));
  const halfB = cells[0].querySelector('b');
  if (val % 10 === 5) halfB.classList.remove('not-done');
  else halfB.classList.add('not-done');
  for (let i = 1; i < cells.length; i++) {
    const b = cells[i].querySelector('b');
    if (val >= i * 10) b.classList.remove('not-done');
    else b.classList.add('not-done');
  }
}

function toggleBleed(el, level) {
  const input = el.parentElement.querySelector('input[name="bleed"]');
  input.value = (parseInt(input.value) || 0) >= level ? level - 1 : level;
  updateBleedDisplay(el.parentElement);
}
function updateBleedDisplay(container) {
  const val = parseInt(container.querySelector('input[name="bleed"]').value) || 0;
  container.querySelectorAll(':scope > .cell-2').forEach((item, i) => {
    item.className = 'cell-2 ' + (i < val ? 'red' : 'grey');
  });
}

function toggleBruise(el, level) {
  const input = el.parentElement.querySelector('input[name="bruise"]');
  input.value = (parseInt(input.value) || 0) >= level ? level - 1 : level;
  updateBruiseDisplay(el.parentElement);
}
function updateBruiseDisplay(container) {
  const val = parseInt(container.querySelector('input[name="bruise"]').value) || 0;
  container.querySelectorAll(':scope > .cell-2').forEach((item, i) => {
    item.className = 'cell-2 ' + (i < val ? 'blue' : 'grey');
  });
}

function toggleVeg(el, level) {
  const input = el.parentElement.querySelector('input[name="veg"]');
  input.value = (parseInt(input.value) || 0) >= level ? level - 1 : level;
  updateVegDisplay(el.parentElement);
}
function updateVegDisplay(container) {
  const val = parseInt(container.querySelector('input[name="veg"]').value) || 0;
  container.querySelectorAll(':scope > .cell-2').forEach((item, i) => {
    item.className = 'cell-2 ' + (i < val ? 'green' : 'grey');
  });
}

function toggleFinger(el, finger) {
  const input = el.parentElement.querySelector('input[name="finger"]');
  const arr = input.value ? input.value.split(' ') : [];
  const idx = arr.indexOf(finger);
  if (idx >= 0) { arr.splice(idx, 1); el.classList.remove('red'); }
  else { arr.push(finger); el.classList.add('red'); }
  input.value = arr.join(' ');
}

// ============ FORM SUBMIT ============
function handleFormSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const day = getDayData(allData, currentYmd);

  // Which button was clicked?
  const clicked = e.submitter;
  const action = clicked ? clicked.dataset.cmd : 'save';

  // Always capture whatever is currently in the form
  day.yami   = parseInt(fd.get('yami')) || 0;
  day.bleed  = parseInt(fd.get('bleed')) || 0;
  day.bruise = parseInt(fd.get('bruise')) || 0;
  day.veg    = parseInt(fd.get('veg')) || 0;
  day.finger = fd.get('finger') || '';
  day.inr    = Math.round((parseFloat(fd.get('inr')) || 0) * 10);
  day.note   = fd.get('note') || '';

  if (action === 'toggle-done') {
    if (day.done) day.done = ''; // undo
    else {
      const now = new Date();
      day.done = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }
  }
  saveAllData(allData);
  render();
}

// ============ IMPORT / EXPORT ============
function exportCSV() {
  const csv = localStorage.getItem(STORAGE_KEY) || CSV_HEADER;
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'yami_' + formatYMD(new Date()) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function exportMonthCSV() {
  const month = currentYmd.substring(0, 7);
  const csv = monthCSV(month);
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'yami_' + month + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}
function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      importCSVText(e.target.result);
    } catch (err) {
      alert('Could not import CSV. Please check the file format.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function monthCSV(month) {
  const rows = [CSV_HEADER];
  Object.values(allData)
    .filter(d => d.ymd.substring(0, 7) === month)
    .sort((a, b) => a.ymd.localeCompare(b.ymd))
    .forEach(d => {
      rows.push([
        csvEscape(d.ymd),
        csvEscape(d.yami),
        csvEscape(d.bleed),
        csvEscape(d.bruise),
        csvEscape(d.veg),
        csvEscape(d.finger),
        csvEscape(d.inr),
        csvEscape(d.done),
        csvEscape(d.note || '')
      ].join(','));
    });
  return rows.join('\n');
}

async function copyMonthCSV() {
  const month = currentYmd.substring(0, 7);
  try {
    await navigator.clipboard.writeText(monthCSV(month));
    alert('Copied ' + month + ' data to clipboard.');
  } catch (err) {
    const textarea = document.getElementById('csv-paste');
    textarea.value = monthCSV(month);
    textarea.focus();
    textarea.select();
    alert('Clipboard unavailable. CSV placed in the textarea; please copy it manually.');
  }
}

function importCSVText(text) {
  const imported = dataFromCSV(text);
  let added = 0, updated = 0;
  for (const ymd in imported) {
    if (allData[ymd]) updated++;
    else added++;
    allData[ymd] = imported[ymd];
  }
  saveAllData(allData);
  render();
  alert('Imported: ' + added + ' new, ' + updated + ' updated.');
}

function uploadPastedCSV() {
  const textarea = document.getElementById('csv-paste');
  const text = textarea.value.trim();
  if (!text) {
    alert('Please paste CSV data first.');
    return;
  }
  try {
    importCSVText(text);
  } catch (err) {
    alert('Could not import CSV. Please check the pasted data.');
  }
}
// ============ INIT ============
allData = loadAllData();
currentYmd = formatYMD(new Date());
render();
</script>
